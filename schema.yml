openapi: 3.0.3
info:
  title: JobTrail API
  version: 1.0.0
  description: REST API for tracking companies, job applications, CV attachments,
    and interviews. JSON responses use the {success, message, data} envelope.
paths:
  /api/applications/:
    get:
      operationId: applications_list
      parameters:
      - in: query
        name: job_type
        schema:
          type: string
          enum:
          - HYBRID
          - ONSITE
          - REMOTE
        description: |-
          * `ONSITE` - Onsite
          * `REMOTE` - Remote
          * `HYBRID` - Hybrid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - APPLIED
          - INTERVIEW
          - OFFER
          - REJECTED
          - WISHLIST
        description: |-
          * `WISHLIST` - Wishlist
          * `APPLIED` - Applied
          * `INTERVIEW` - Interview
          * `OFFER` - Offer
          * `REJECTED` - Rejected
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApplicationList'
          description: ''
    post:
      operationId: applications_create
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/applications/{id}/:
    get:
      operationId: applications_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
    put:
      operationId: applications_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
    patch:
      operationId: applications_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApplicationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApplicationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApplicationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
    delete:
      operationId: applications_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/applications/{id}/cv/:
    get:
      operationId: applications_cv_retrieve
      description: Download the application's private CV attachment.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '404':
          description: No CV attachment was found.
    delete:
      operationId: applications_cv_destroy
      description: Delete the application's CV attachment.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          description: No CV attachment was found.
  /api/applications/export/:
    get:
      operationId: applications_export_retrieve
      description: Export the authenticated user's applications as CSV. List filters,
        search, and ordering are supported.
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: ''
  /api/companies/:
    get:
      operationId: companies_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: ''
    post:
      operationId: companies_create
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
  /api/companies/{id}/:
    get:
      operationId: companies_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company.
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    put:
      operationId: companies_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    patch:
      operationId: companies_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company.
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCompanyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    delete:
      operationId: companies_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this company.
        required: true
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/interviews/:
    get:
      operationId: interviews_list
      parameters:
      - in: query
        name: application
        schema:
          type: integer
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - ONSITE
          - PHONE
          - VIDEO
        description: |-
          * `ONSITE` - Onsite
          * `VIDEO` - Video
          * `PHONE` - Phone
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: result
        schema:
          type: string
          enum:
          - FAILED
          - PASSED
          - PENDING
        description: |-
          * `PENDING` - Pending
          * `PASSED` - Passed
          * `FAILED` - Failed
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInterviewList'
          description: ''
    post:
      operationId: interviews_create
      tags:
      - interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
  /api/interviews/{id}/:
    get:
      operationId: interviews_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this interview.
        required: true
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
    put:
      operationId: interviews_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this interview.
        required: true
      tags:
      - interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
    patch:
      operationId: interviews_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this interview.
        required: true
      tags:
      - interviews
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInterviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedInterviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInterviewRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
    delete:
      operationId: interviews_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this interview.
        required: true
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/interviews/upcoming/:
    get:
      operationId: interviews_upcoming_retrieve
      tags:
      - interviews
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interview'
          description: ''
  /api/login/:
    post:
      operationId: login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/register/:
    post:
      operationId: register_create
      tags:
      - register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/stats/:
    get:
      operationId: stats_retrieve
      tags:
      - stats
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        company:
          type: string
          maxLength: 120
        position:
          type: string
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusEnum'
        job_type:
          $ref: '#/components/schemas/JobTypeEnum'
        applied_on:
          type: string
          format: date
          nullable: true
        expected_salary:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        job_link:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        notes:
          type: string
        has_cv:
          type: boolean
          readOnly: true
        cv_download_url:
          type: string
          nullable: true
          readOnly: true
        needs_follow_up:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company
      - created_at
      - cv_download_url
      - has_cv
      - id
      - needs_follow_up
      - owner
      - position
      - updated_at
    ApplicationRequest:
      type: object
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusEnum'
        job_type:
          $ref: '#/components/schemas/JobTypeEnum'
        applied_on:
          type: string
          format: date
          nullable: true
        expected_salary:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        job_link:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        notes:
          type: string
        cv:
          type: string
          format: binary
          writeOnly: true
          nullable: true
          pattern: (?:pdf|doc|docx)$
      required:
      - company
      - position
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        location:
          type: string
          maxLength: 120
        applications_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applications_count
      - created_at
      - id
      - name
    CompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        location:
          type: string
          maxLength: 120
      required:
      - name
    Interview:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        application:
          type: integer
        position:
          type: string
          readOnly: true
        company:
          type: string
          readOnly: true
        round_name:
          type: string
          maxLength: 100
        scheduled_at:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/ModeEnum'
        result:
          $ref: '#/components/schemas/ResultEnum'
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - application
      - company
      - created_at
      - id
      - position
      - round_name
      - scheduled_at
      - updated_at
    InterviewRequest:
      type: object
      properties:
        application:
          type: integer
        round_name:
          type: string
          minLength: 1
          maxLength: 100
        scheduled_at:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/ModeEnum'
        result:
          $ref: '#/components/schemas/ResultEnum'
        notes:
          type: string
      required:
      - application
      - round_name
      - scheduled_at
    JobTypeEnum:
      enum:
      - ONSITE
      - REMOTE
      - HYBRID
      type: string
      description: |-
        * `ONSITE` - Onsite
        * `REMOTE` - Remote
        * `HYBRID` - Hybrid
    ModeEnum:
      enum:
      - ONSITE
      - VIDEO
      - PHONE
      type: string
      description: |-
        * `ONSITE` - Onsite
        * `VIDEO` - Video
        * `PHONE` - Phone
    PaginatedApplicationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Application'
    PaginatedCompanyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Company'
    PaginatedInterviewList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Interview'
    PatchedApplicationRequest:
      type: object
      properties:
        company:
          type: string
          minLength: 1
          maxLength: 120
        position:
          type: string
          minLength: 1
          maxLength: 120
        status:
          $ref: '#/components/schemas/StatusEnum'
        job_type:
          $ref: '#/components/schemas/JobTypeEnum'
        applied_on:
          type: string
          format: date
          nullable: true
        expected_salary:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        job_link:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        notes:
          type: string
        cv:
          type: string
          format: binary
          writeOnly: true
          nullable: true
          pattern: (?:pdf|doc|docx)$
    PatchedCompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        location:
          type: string
          maxLength: 120
    PatchedInterviewRequest:
      type: object
      properties:
        application:
          type: integer
        round_name:
          type: string
          minLength: 1
          maxLength: 100
        scheduled_at:
          type: string
          format: date-time
        mode:
          $ref: '#/components/schemas/ModeEnum'
        result:
          $ref: '#/components/schemas/ResultEnum'
        notes:
          type: string
    Register:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
      required:
      - email
      - id
      - username
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
